name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.15.21,<0.16"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Install public demo dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public demo tests
        run: python -m pytest -q tests/test_public_demo.py

      - name: Smoke-test public demo
        run: ai-quant-demo --output outputs/public_demo_smoke --bars 360 --seed 11
