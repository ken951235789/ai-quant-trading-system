[project]
name = "ai-quant-trading-system"
version = "1.0.0rc1"
description = "人工智慧量化交易系統研究專案"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "defusedxml>=0.7.1,<1.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0,<3.0",
    "idna>=3.15,<4.0",
    "websocket-client>=1.8,<2.0",
    "python-dotenv>=1.2.2",
    "truststore>=0.10.4; sys_platform == 'win32'",
]

[project.scripts]
ai-quant-demo = "ai_quant_trading.public_demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.21,<0.16",
]
security = [
    "bandit>=1.9.4,<2.0",
    "pip-audit>=2.10.1,<3.0",
]
dashboard = [
    # Streamlit 會間接安裝 GitPython；固定安全版本，避免舊版 URL 注入問題。
    "GitPython>=3.1.58",
    "pillow>=12.3.0",
    "plotly>=5.24,<7.0",
    "pyarrow>=23.0.1,<24.0",
    "streamlit>=1.55,<2.0",
    "tornado>=6.5.7,<7.0",
]
ai = [
    "filelock>=3.20.3",
    "safetensors>=0.4,<1.0",
    "torch>=2.13.0",
    "transformers>=5.0,<6.0",
]
rl = [
    "gymnasium>=1.1,<2.0",
    "stable-baselines3>=2.7,<3.0",
]
database = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "duckdb>=1.4,<2.0",
]
package = [
    "pyinstaller>=6.16,<7.0",
    "pywebview>=6.2,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
